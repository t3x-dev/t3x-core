name: Documentation boundary
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  documentation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tools/check-documentation-boundary.mjs
