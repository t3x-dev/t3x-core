name: Transition Conformance

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  independent-verifier:
    name: Independent Python verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/transition-conformance-python/requirements.lock

      - name: Install hash-pinned conformance dependencies
        run: >-
          python -m pip install
          --require-hashes
          -r tools/transition-conformance-python/requirements.lock

      - name: Run independent verifier
        run: >-
          python tools/transition-conformance-python/run.py
          --repo-root .

      - name: Run verifier adversarial tests
        env:
          PYTHONPATH: tools/transition-conformance-python
        run: >-
          python -m unittest discover
          -s tools/transition-conformance-python/tests
          -v
