<svg width="920" height="500" viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>T3X thin-waist architecture</title>
  <desc>Task surfaces depend on trusted application use cases, native adapters, and a leaf Transition protocol kernel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.52" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <marker id="down" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="920" height="500" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="918" height="498" rx="23" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="48" y="42" fill="#e2e8f0" font-size="18" font-weight="800">Thin waist, explicit ownership</text>
  <text x="872" y="42" fill="#64748b" font-size="11" font-weight="650" text-anchor="end">dependencies point inward</text>

  <text x="48" y="82" fill="#64748b" font-size="11" font-weight="750" letter-spacing="1.5">TASK SURFACES</text>
  <g filter="url(#shadow)" fill="#172554" stroke="#3b82f6">
    <rect x="48" y="96" width="184" height="54" rx="13"/>
    <rect x="262" y="96" width="184" height="54" rx="13"/>
    <rect x="476" y="96" width="184" height="54" rx="13"/>
    <rect x="690" y="96" width="182" height="54" rx="13"/>
  </g>
  <g fill="#dbeafe" font-size="15" font-weight="750" text-anchor="middle">
    <text x="140" y="129">WebUI</text>
    <text x="354" y="129">API</text>
    <text x="568" y="129">CLI</text>
    <text x="781" y="129">MCP</text>
  </g>

  <line x1="460" y1="157" x2="460" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#down)"/>

  <text x="48" y="190" fill="#64748b" font-size="11" font-weight="750" letter-spacing="1.5">APPLICATION USE CASES · TRUSTED BOUNDARY</text>
  <g filter="url(#shadow)" fill="#111827" stroke="#8b5cf6">
    <rect x="48" y="204" width="184" height="62" rx="13"/>
    <rect x="262" y="204" width="184" height="62" rx="13"/>
    <rect x="476" y="204" width="184" height="62" rx="13"/>
    <rect x="690" y="204" width="182" height="62" rx="13"/>
  </g>
  <g text-anchor="middle">
    <text x="140" y="233" fill="#ede9fe" font-size="15" font-weight="750">Propose</text>
    <text x="140" y="250" fill="#94a3b8" font-size="9.5">compile + membership</text>
    <text x="354" y="233" fill="#ede9fe" font-size="15" font-weight="750">Verify</text>
    <text x="354" y="250" fill="#94a3b8" font-size="9.5">replay + observations</text>
    <text x="568" y="233" fill="#ede9fe" font-size="15" font-weight="750">Decide</text>
    <text x="568" y="250" fill="#94a3b8" font-size="9.5">policy + authority</text>
    <text x="781" y="233" fill="#ede9fe" font-size="15" font-weight="750">Commit</text>
    <text x="781" y="250" fill="#94a3b8" font-size="9.5">audit + CAS</text>
  </g>

  <line x1="460" y1="273" x2="460" y2="294" stroke="#475569" stroke-width="2" marker-end="url(#down)"/>

  <text x="48" y="306" fill="#64748b" font-size="11" font-weight="750" letter-spacing="1.5">NATIVE ADAPTERS + APPLICATION INFRASTRUCTURE</text>
  <g filter="url(#shadow)">
    <rect x="48" y="320" width="250" height="66" rx="13" fill="#431407" stroke="#f97316"/>
    <rect x="335" y="320" width="250" height="66" rx="13" fill="#3b0764" stroke="#c084fc"/>
    <rect x="622" y="320" width="250" height="66" rx="13" fill="#052e2b" stroke="#10b981"/>
  </g>
  <g text-anchor="middle">
    <text x="173" y="349" fill="#ffedd5" font-size="14" font-weight="750">Mutation</text>
    <text x="173" y="369" fill="#fdba74" font-size="10">YOps · codecs · drivers</text>
    <text x="460" y="349" fill="#f3e8ff" font-size="14" font-weight="750">Statements</text>
    <text x="460" y="369" fill="#d8b4fe" font-size="10">YSchema · Runner · evaluators</text>
    <text x="747" y="349" fill="#d1fae5" font-size="14" font-weight="750">Repository</text>
    <text x="747" y="369" fill="#6ee7b7" font-size="10">resolver · storage · refs · policy</text>
  </g>

  <line x1="460" y1="393" x2="460" y2="414" stroke="#475569" stroke-width="2" marker-end="url(#down)"/>

  <g filter="url(#shadow)">
    <rect x="48" y="428" width="824" height="48" rx="15" fill="url(#kernel)" stroke="#94a3b8" stroke-opacity="0.65"/>
  </g>
  <text x="70" y="457" fill="#ffffff" font-size="13" font-weight="800">TRANSITION KERNEL</text>
  <text x="253" y="457" fill="#dbeafe" font-size="12" font-weight="700">State</text>
  <text x="329" y="457" fill="#ffedd5" font-size="12" font-weight="700">Effect</text>
  <text x="410" y="457" fill="#f3e8ff" font-size="12" font-weight="700">Statement</text>
  <text x="511" y="457" fill="#d1fae5" font-size="12" font-weight="700">CommitV2</text>
  <text x="620" y="457" fill="#e2e8f0" font-size="10.5" font-weight="650">Replay · identity · integrity</text>
</svg>
