yschema: "0.1"
name: t3x/skill
version: "v1"
description: Portable workflow-routed agent skill with deterministic delivery checks.
strict: true

nodes:
  manifest:
    required: true
    content_kind: structured
    description: Stable identity and discovery metadata for the skill.
    required_slots: [name, summary]
    slots:
      name:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        max_length: 64
        provenance_required: true
        description: Lowercase hyphen-case skill name.
        gap_question: What concise, action-oriented name should identify this skill?
      summary:
        type: string
        max_words: 60
        provenance_required: true
        description: Portable capability summary; host trigger text is generated with activation boundaries.
        gap_question: What portable capability does this skill provide?

  activation:
    required: true
    content_kind: structured
    description: Positive and negative activation boundaries.
    required_slots: [implicit, should_trigger, should_not_trigger]
    slots:
      implicit:
        type: boolean
        description: Whether the host may activate the skill without an explicit mention.
      should_trigger:
        type: array
        provenance_required: true
        description: Concrete user requests that should activate the skill.
        gap_question: Give at least one request that should trigger this skill.
      should_not_trigger:
        type: array
        provenance_required: true
        description: Nearby requests that should not activate the skill.
        gap_question: Give at least one similar request that should not trigger this skill.

  contract:
    required: true
    content_kind: structured
    description: Inputs, outputs, boundaries, and truth policy.
    required_slots: [goal, inputs, outputs, non_goals, truth_policy]
    slots:
      goal:
        type: string
        max_words: 80
        provenance_required: true
        gap_question: What concrete outcome should this skill produce?
      inputs:
        type: array
        provenance_required: true
        gap_question: What inputs does this skill require or accept?
      outputs:
        type: array
        provenance_required: true
        gap_question: What outputs should this skill produce?
      non_goals:
        type: array
        provenance_required: true
        gap_question: What adjacent work is explicitly outside this skill?
      truth_policy:
        enum: [evidence_only, approved_inference, open_generation]
        description: How generated claims must be grounded or approved.
      default_freedom:
        enum: [high, medium, low]
        description: Optional authoring default; every instruction still declares its own freedom.

  workflows:
    required: true
    repeated: true
    content_kind: structured
    description: Routable capability modes that own steps, resources, dependencies, and failure behavior.
    required_slots: [title, kind, when, output_formats, persistence, on_empty, on_failure]
    slots:
      title:
        type: string
        max_words: 16
        provenance_required: true
      kind:
        enum: [primary, supporting, persistence, review]
      when:
        type: string
        max_words: 60
        provenance_required: true
        description: Concrete routing condition for choosing this workflow.
      output_formats:
        type: array
      persistence:
        enum: [none, optional, required]
      on_empty:
        enum: [continue, use_builtin_defaults, ask_user, report_and_stop]
      on_failure:
        enum: [continue, fallback, ask_user, report_and_stop]
      fallback_workflow:
        type: string
        pattern: "^[a-z0-9]+(?:_[a-z0-9]+)*$"

  instructions:
    required: true
    repeated: true
    content_kind: structured
    description: Ordered executable guidance for the agent.
    content_guidance: Keep core instructions concise and move detailed material into resources.
    required_slots:
      [sequence, kind, title, body, freedom, effect, approval, success_criteria]
    slots:
      sequence:
        type: integer
        minimum: 1
        description: Stable display and execution order.
      kind:
        enum:
          [principle, procedure, constraint, output_format, example, verification, recovery]
      title:
        type: string
        max_words: 16
        provenance_required: true
      body:
        type: string
        provenance_required: true
        description: Concise imperative instruction.
        gap_question: What should the agent do at this step?
      freedom:
        enum: [high, medium, low]
      effect:
        enum: [none, read, write, external]
      approval:
        enum: [none, before_write, before_external]
      success_criteria:
        type: array
      on_failure:
        type: string

  resources:
    required: false
    repeated: true
    content_kind: structured
    description: Scripts, data, references, assets, and templates with explicit context-loading policy.
    required_slots: [kind, path, description, load_policy, use_when]
    slots:
      kind:
        enum: [script, data, reference, asset, template]
      path:
        type: string
        pattern: '^(?![A-Za-z]:)(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$'
        description: Safe relative path inside the generated skill bundle.
      use_when:
        type: string
        max_words: 60
      description:
        type: string
        max_words: 60
      load_policy:
        enum: [always, on_demand, execute_only, output_only]
      media_type:
        type: string
      source_url:
        type: string
        format: uri
      revision:
        type: string
      content_hash:
        type: string
        pattern: "^sha256:[a-f0-9]{64}$"

  dependencies:
    required: false
    repeated: true
    content_kind: structured
    description: External capabilities required by instructions.
    required_slots: [kind, identifier, required, permissions]
    slots:
      kind:
        enum: [tool, mcp, plugin, runtime, package]
      identifier:
        type: string
      required:
        type: boolean
      permissions:
        type: array
      description:
        type: string
      version_constraint:
        type: string
      use_when:
        type: string

  checks:
    required: true
    repeated: true
    content_kind: structured
    description: Deterministic commands, smoke tests, and human-verifiable delivery checklists.
    required_slots: [kind, run_when, blocking]
    slots:
      kind:
        enum: [command, checklist, smoke_test]
      run_when:
        enum: [preflight, before_workflow, after_workflow, pre_export, before_delivery]
      blocking:
        type: boolean
      command_resource:
        type: string
      assertions:
        type: array
      success_criteria:
        type: array

  evals:
    required: false
    repeated: true
    content_kind: structured
    description: Triggering, behavior, and safety checks for the skill.
    required_slots: [kind, prompt, assertions]
    slots:
      kind:
        enum: [trigger_positive, trigger_negative, behavior, safety]
      prompt:
        type: string
        provenance_required: true
      expected_output:
        type: string
      assertions:
        type: array
      files:
        type: array

relation_types:
  has_step:
    from: workflows/*
    to: instructions/*
    description: Workflow owns an ordered instruction step.
  precedes:
    from: instructions/*
    to: instructions/*
    description: Source instruction must execute before target instruction.
    acyclic: true
  workflow_uses_resource:
    from: workflows/*
    to: resources/*
    description: Workflow routes to a bundled resource.
  instruction_uses_resource:
    from: instructions/*
    to: resources/*
    description: Instruction loads or executes a bundled resource.
  requires:
    from: workflows/*
    to: dependencies/*
    description: Workflow requires an external capability.
  verifies:
    from: checks/*
    to: workflows/*
    description: Deterministic check gates a workflow.

rules:
  - id: implicit-trigger-examples
    description: Implicit skills require positive and negative trigger examples.
  - id: generated-trigger-description
    description: Exported host description is generated from manifest summary and activation boundaries.
  - id: workflow-routing
    description: Every workflow owns steps and every instruction belongs to at least one workflow.
  - id: resource-load-policy
    description: Resource use must honor always, on-demand, execute-only, or output-only loading.
  - id: low-freedom-verification
    description: Low-freedom instructions require deterministic success criteria.
  - id: side-effect-approval
    description: Write and external effects require an explicit approval gate.
  - id: deterministic-check-gate
    description: Every workflow requires a blocking deterministic check before export or delivery.
  - id: publish-eval-coverage
    description: Ready skills also require non-deterministic behavior evaluation coverage.
