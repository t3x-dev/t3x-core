yschema: "0.1"
name: t3x/prompt
version: "v1"
description: Portable, typed, and testable contract for one model invocation.
strict: true

nodes:
  manifest:
    required: true
    content_kind: structured
    description: Stable identity and discovery metadata for the prompt.
    required_slots: [name, summary]
    slots:
      name:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        max_length: 64
        provenance_required: true
        description: Lowercase hyphen-case prompt name.
        gap_question: What concise name should identify this prompt?
      summary:
        type: string
        max_words: 60
        provenance_required: true
        description: Portable summary of the model invocation.
        gap_question: What model task does this prompt perform?

  contract:
    required: true
    content_kind: structured
    description: Goal, inputs, outputs, boundaries, and truth policy.
    required_slots: [goal, inputs, outputs, non_goals, truth_policy]
    slots:
      goal:
        type: string
        max_words: 80
        provenance_required: true
        gap_question: What concrete outcome should this prompt produce?
      inputs:
        type: array
        min_length: 1
        provenance_required: true
        gap_question: What inputs does this prompt accept?
      outputs:
        type: array
        min_length: 1
        provenance_required: true
        gap_question: What outputs must this prompt produce?
      non_goals:
        type: array
        provenance_required: true
        gap_question: What work is explicitly outside this prompt?
      truth_policy:
        enum: [evidence_only, approved_inference, open_generation]
        description: How generated claims must be grounded or approved.

  variables:
    required: true
    repeated: true
    content_kind: structured
    description: Typed template inputs and their resolution behavior.
    required_slots: [value_type, required, source, description, on_missing]
    slots:
      value_type:
        enum: [string, number, integer, boolean, array, object]
      required:
        type: boolean
      source:
        enum: [user, context, runtime, default]
      description:
        type: string
        max_words: 40
        provenance_required: true
      default_value:
        description: Optional default whose type is checked by the Prompt compiler.
      enum_values:
        type: array
      value_pattern:
        type: string
        description: Optional regex applied to resolved string values by the Prompt compiler.
      sensitive:
        type: boolean
        default: false
      on_missing:
        enum: [ask_user, use_default, use_empty, report_and_stop]

  messages:
    required: true
    repeated: true
    content_kind: structured
    description: Ordered text messages compiled for one model invocation.
    required_slots: [sequence, role, template, purpose, optional, on_missing_variable]
    slots:
      sequence:
        type: integer
        minimum: 1
      role:
        enum: [system, developer, user, assistant]
      template:
        type: string
        min_length: 1
        provenance_required: true
        description: Text template using declared double-brace variables.
        gap_question: What message content should be compiled at this position?
      purpose:
        type: string
        max_words: 40
        provenance_required: true
      optional:
        type: boolean
      condition:
        type: string
      on_missing_variable:
        enum: [omit_message, use_empty, ask_user, report_and_stop]

  contexts:
    required: false
    repeated: true
    content_kind: structured
    description: Runtime context sources and explicit loading budgets.
    required_slots: [kind, required, load_policy, placement, on_empty]
    slots:
      kind:
        enum: [static, retrieval, conversation, runtime]
      required:
        type: boolean
      load_policy:
        enum: [always, on_demand]
      placement:
        enum: [before_system, after_system, before_user, inline]
      max_tokens:
        type: integer
        minimum: 1
      resource_key:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
      on_empty:
        enum: [continue, use_default, ask_user, report_and_stop]

  runtime:
    required: true
    content_kind: structured
    description: Portable runtime requirements resolved by a host adapter.
    required_slots: [mode, response_format, streaming, tool_policy]
    slots:
      mode:
        enum: [chat, completion]
      response_format:
        enum: [text, markdown, json, json_schema]
      streaming:
        type: boolean
      tool_policy:
        enum: [none, optional, required]
      max_output_tokens:
        type: integer
        minimum: 1

  output:
    required: true
    content_kind: structured
    description: Response parsing contract and deterministic failure behavior.
    required_slots: [format, strict, on_parse_failure]
    slots:
      format:
        enum: [text, markdown, json, json_schema]
      schema_resource:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
      strict:
        type: boolean
      on_parse_failure:
        enum: [retry_once, return_raw, report_and_stop]
      max_retries:
        type: integer
        minimum: 0
        maximum: 3

  resources:
    required: false
    repeated: true
    content_kind: structured
    description: Bundled schemas, fixtures, data, references, and templates.
    required_slots: [kind, path, description, load_policy]
    slots:
      kind:
        enum: [schema, fixture, data, reference, template]
      path:
        type: string
        pattern: '^(?![A-Za-z]:)(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$'
        description: Safe relative path inside the prompt bundle.
      description:
        type: string
        max_words: 60
      load_policy:
        enum: [always, on_demand, execute_only, output_only]
      media_type:
        type: string
      content_hash:
        type: string
        pattern: "^sha256:[a-f0-9]{64}$"

  dependencies:
    required: false
    repeated: true
    content_kind: structured
    description: External capabilities required to compile or execute messages.
    required_slots: [kind, identifier, required, permissions]
    slots:
      kind:
        enum: [tool, mcp, plugin, runtime, package]
      identifier:
        type: string
      required:
        type: boolean
      permissions:
        type: array
      description:
        type: string
      version_constraint:
        type: string

  checks:
    required: true
    repeated: true
    content_kind: structured
    description: Deterministic gates for compiling, exporting, running, or committing the prompt.
    required_slots: [kind, run_when, blocking]
    slots:
      kind:
        enum: [template_compile, fixture_render, output_schema, checklist]
      run_when:
        enum: [preflight, pre_compile, post_compile, pre_run, pre_commit]
      blocking:
        type: boolean
      fixture_resource:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
      assertions:
        type: array
      success_criteria:
        type: array

  evals:
    required: false
    repeated: true
    content_kind: structured
    description: Non-deterministic behavior, quality, safety, and regression evaluations.
    required_slots: [kind, fixture_resource, assertions]
    slots:
      kind:
        enum: [behavior, quality, safety, regression]
      fixture_resource:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
      expected_output:
        type: string
      assertions:
        type: array
      minimum_score:
        type: number
        minimum: 0
        maximum: 1

relation_types:
  precedes:
    from: messages/*
    to: messages/*
    description: Source message must be compiled before target message.
    acyclic: true

  uses_variable:
    from: messages/*
    to: variables/*
    description: Message template references a declared variable.

  uses_resource:
    from: messages/*
    to: resources/*
    description: Message loads or references a bundled resource.

  provides_context:
    from: contexts/*
    to: messages/*
    description: Context source contributes content to a message.

  requires:
    from: messages/*
    to: dependencies/*
    description: Message requires an external runtime capability.

  uses_output_schema:
    from: output
    to: resources/*
    description: Output contract resolves its schema from a bundled resource.

  verifies_message:
    from: checks/*
    to: messages/*
    description: Deterministic check validates a compiled message.

  verifies_output:
    from: checks/*
    to: output
    description: Deterministic check validates the output contract.

  evaluates:
    from: evals/*
    to: messages/*
    description: Model evaluation covers behavior driven by a message.

rules:
  - id: prompt.placeholders_declared
    description: Every template placeholder must resolve to a declared variable.
  - id: prompt.required_variables_used
    description: Every required variable must be referenced by at least one message.
  - id: prompt.message_sequence_unique
    description: Message sequence values must be unique and compile in ascending order.
  - id: prompt.resources_resolvable
    description: Referenced context, fixture, and message resources must exist.
  - id: prompt.output_schema_resolvable
    description: JSON Schema output must resolve to a schema resource.
  - id: prompt.blocking_check_required
    description: A ready prompt requires a blocking compile or output check.
