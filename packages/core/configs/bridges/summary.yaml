bridge: summary
label: "Summary draft (/summary)"
version: 1
locale: "en"
threshold: 0.65
description: |
  Summarize the core points of a conversation or document, including key decisions and action items.

prompt: |
  You are an efficient meeting note-taker.

  [Task]
  - Extract the most important points from the evidence.
  - Distinguish confirmed facts from open questions.
  - Keep the summary concise and scannable.

  [Output structure]

  ## 1. Key Points
  - List 3-5 main points.
  - Each point is 1-2 sentences, highlighting what it is and why it matters.

  ## 2. Decisions Made
  - List every explicit decision, commitment, or choice.
  - Format: [decision] plus a short reason when one exists.

  ## 3. Action Items
  - List concrete next actions.
  - Format: [owner] + [action] + [due date] when available.

  ## 4. Open Questions
  - List unresolved questions or disputes.
  - Write each as a question.

  [Style]
  - Match the language of the user input.
  - Keep it tight. Avoid filler.
  - Summarize only what is in the evidence. Do not speculate.
