version: 1
notes: |
  Source of truth for the T3X alpha release package surface.
  Changes to public package entries require owner approval and a stability note.
  release_train: active means the package can be selected by automated package
  release preparation; paused keeps an existing public npm package out of the
  default release train without deleting or unpublishing it.
packages:
  - name: "@t3x-dev/local"
    path: apps/local
    access: public
    publish_state: applied
    npm_publish: true
    release_train: paused
    stability_tier: alpha
    readme_required: true
    api_extractor: false
    why: Existing public local installer; paused from release-train publishing while runtime artifacts stay explicit.

  - name: "@t3x-dev/yops"
    path: packages/yops
    access: public
    publish_state: applied
    npm_publish: true
    release_train: active
    stability_tier: alpha
    readme_required: true
    api_extractor: true
    why: Public deterministic operation contract for JSON-compatible YAML documents.

  - name: "@t3x-dev/core"
    path: packages/core
    access: restricted
    publish_state: applied
    npm_publish: false
    stability_tier: internal
    readme_required: false
    api_extractor: false
    why: Candidate engine package; not part of the alpha public surface.

  - name: "@t3x-dev/transition"
    path: packages/transition
    access: public
    publish_state: applied
    npm_publish: true
    release_train: active
    stability_tier: alpha
    readme_required: true
    api_extractor: false
    why: Public alpha protocol contracts, Replay, identity, and integrity verification for third-party agents and MCP tools.

  - name: "@t3x-dev/yschema"
    path: packages/yschema
    access: public
    publish_state: applied
    npm_publish: true
    release_train: active
    stability_tier: alpha
    readme_required: true
    api_extractor: false
    why: Public alpha schema validation candidate for schema-backed structured state.

  - name: "@t3x-dev/api-client"
    path: packages/api-client
    access: restricted
    publish_state: applied
    npm_publish: false
    stability_tier: internal
    readme_required: false
    api_extractor: false
    why: Candidate client package; not part of the alpha public surface.

  - name: "@t3x-dev/cli"
    path: apps/cli
    access: restricted
    publish_state: applied
    npm_publish: false
    stability_tier: internal
    readme_required: false
    api_extractor: false
    why: Candidate CLI package; not part of the alpha public surface.

  - name: "@t3x-dev/mcp"
    path: apps/mcp
    access: restricted
    publish_state: applied
    npm_publish: false
    stability_tier: internal
    readme_required: false
    api_extractor: false
    why: Candidate MCP package; not part of the alpha public surface.

  - name: "@t3x-dev/api"
    path: packages/api
    access: restricted
    publish_state: applied
    npm_publish: false
    stability_tier: internal
    readme_required: false
